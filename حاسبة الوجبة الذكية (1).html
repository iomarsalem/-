<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الوجبة الذكية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ee;--fg:#25291f;--card:#ffffff;--border:#ded9c9;--accent:#5a7d4a;--muted:#6b7062;--bad:#b3432b;--good:#3d7a3d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f17;--fg:#eae7db;--card:#262a1d;--border:#3a3f2c;--accent:#8fc47a;--muted:#9a9d8c;--bad:#e0776a;--good:#8fc47a}}
:root[data-theme="dark"]{--bg:#1c1f17;--fg:#eae7db;--card:#262a1d;--border:#3a3f2c;--accent:#8fc47a;--muted:#9a9d8c;--bad:#e0776a;--good:#8fc47a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,'Segoe UI',Arial,sans-serif;line-height:1.6;padding:20px 16px 40px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin:4px 0 2px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
textarea{width:100%;min-height:90px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:1rem;font-family:inherit;resize:vertical}
button{margin-top:10px;background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:10px;font-size:1rem;cursor:pointer}
button:active{opacity:.85}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.grid div b{display:block;font-size:1.2rem}
.grid div span{color:var(--muted);font-size:.75rem}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.items li:last-child{border-bottom:none}
.tag{font-size:.72rem;color:var(--muted)}
.verdict{font-weight:bold;padding:10px 14px;border-radius:10px;margin-top:14px;display:none}
.ok{background:rgba(61,122,61,.15);color:var(--good);display:block}
.no{background:rgba(179,67,43,.15);color:var(--bad);display:block}
ul.sugg{margin:10px 0 0;padding-inline-start:20px;font-size:.88rem}
.note{color:var(--muted);font-size:.76rem;margin-top:18px}
#out{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>🥗 حاسبة الوجبة الذكية</h1>
<p class="sub">اكتب الوجبة اللي راح تاكلها بأسلوبك العادي، وبنحسب لك السعرات والبروتين ونقول لك هل هي متكاملة.</p>
<textarea id="inp" placeholder="مثال: تفاحة وموزتين وخبزة بيضاء داخلها جبن كيري وعصير برتقال المراعي 300 ملي"></textarea>
<br><button onclick="calc()">احسب الوجبة</button>

<div class="card" id="out">
<div class="grid">
<div><b id="cCal">0</b><span>سعرة</span></div>
<div><b id="cPro">0</b><span>بروتين g</span></div>
<div><b id="cCar">0</b><span>كارب g</span></div>
<div><b id="cFat">0</b><span>دهون g</span></div>
</div>
<ul class="items" id="itemsList"></ul>
<div class="verdict" id="verdict"></div>
<ul class="sugg" id="sugg"></ul>
</div>
<p class="note">التقديرات تقريبية وتعتمد على قاعدة بيانات محدودة لأشهر الأطعمة عند الطلاب، وما تغني عن استشارة أخصائي تغذية.</p>
</div>
<script>
const DB=[
["تفاح","تفاح,تفاحة,تفاحتين:2,تفاحات",52,.3,14,.2,150,"fruit"],
["موز","موز,موزة,موزتين:2,موزات",89,1.1,23,.3,120,"fruit"],
["برتقال","برتقال,برتقالة,برتقالتين:2",47,.9,12,.1,150,"fruit"],
["تمر","تمر,تمرات",277,1.8,75,.2,40,"fruit"],
["عنب","عنب",69,.7,18,.2,80,"fruit"],
["خبز أبيض","خبز أبيض,خبزة بيضاء,توست,صامولي",265,9,49,3.2,30,"grain"],
["خبز أسمر","خبز أسمر,خبزة أسمر",247,13,41,3.4,30,"grain"],
["تميس","تميس",280,8,50,5,90,"grain"],
["أرز","أرز,رز",130,2.7,28,.3,150,"grain"],
["معكرونة","معكرونة,مكرونة,باستا",131,5,25,1.1,150,"grain"],
["بيضة","بيضة,بيض,بيضتين:2",155,13,1.1,11,50,"protein"],
["جبنة كيري","كيري,جبن كيري,جبنة كيري",280,9,4,25,17.5,"protein"],
["جبنة شيدر","شيدر,جبن شيدر,جبنة شيدر",403,25,1.3,33,20,"protein"],
["لبنة","لبنة",290,8,6,27,30,"protein"],
["تونة","تونة",116,26,0,1,80,"protein"],
["دجاج","دجاج,صدر دجاج",165,31,0,3.6,100,"protein"],
["فول","فول",110,7.6,18,.6,150,"protein"],
["حمص","حمص",164,8.9,27,2.6,150,"protein"],
["حليب","حليب,لبن",42,3.4,5,1,200,"dairy"],
["زبادي","زبادي",59,3.5,4.7,3.3,170,"dairy"],
["عصير برتقال","عصير برتقال",45,.7,10.4,.2,200,"drink"],
["عصير تفاح","عصير تفاح",46,.1,11.3,.1,200,"drink"],
["عصير مانجو","عصير مانجو",60,.4,15,.2,200,"drink"],
["شوكولاتة","شوكولاتة",530,7.6,59,30,20,"sweet"],
["بسكويت","بسكويت",480,6,65,22,25,"sweet"],
["شيبس","شيبس",536,7,53,34,30,"sweet"],
["خيار","خيار",15,.7,3.6,.1,100,"veg"],
["جزر","جزر",41,.9,10,.2,60,"veg"]
];
function norm(t){return t.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'');}
function calc(){
let raw=document.getElementById('inp').value.trim();
if(!raw)return;
let text=' '+norm(raw)+' ';
let all=[];
DB.forEach(f=>{f[1].split(',').forEach(a=>{let p=a.split(':');all.push({alias:norm(p[0]),count:p[1]?+p[1]:1,food:f});});});
all.sort((a,b)=>b.alias.length-a.alias.length);
let matches=[];
all.forEach(a=>{
let idx;
while((idx=text.indexOf(a.alias))!==-1){
let before=text.slice(Math.max(0,idx-20),idx);
let after=text.slice(idx+a.alias.length,idx+a.alias.length+20);
let m=(before+'|'+after).match(/(\d+)\s*(مل|ملي|غم|جم|جرام|غرام)?/);
let grams,exact=false;
if(a.count===1&&m&&m[1]){
if(m[2]){grams=+m[1];exact=true;}
else{grams=+m[1]*a.food[6];}
}else{grams=a.count*a.food[6];}
matches.push({food:a.food,grams,exact});
text=text.slice(0,idx)+' '.repeat(a.alias.length)+text.slice(idx+a.alias.length);
}
});
let tot={cal:0,pro:0,car:0,fat:0};
let groups=new Set();
let li='';
matches.forEach(x=>{
let f=x.food,r=x.grams/100;
tot.cal+=f[2]*r;tot.pro+=f[3]*r;tot.car+=f[4]*r;tot.fat+=f[5]*r;
groups.add(f[7]);
li+=`<li><span>${f[0]} — ${Math.round(x.grams)}g <span class="tag">(${x.exact?'محدد':'تقريبي'})</span></span><span>${Math.round(f[2]*r)} سعرة</span></li>`;
});
document.getElementById('out').style.display='block';
document.getElementById('cCal').textContent=Math.round(tot.cal);
document.getElementById('cPro').textContent=Math.round(tot.pro);
document.getElementById('cCar').textContent=Math.round(tot.car);
document.getElementById('cFat').textContent=Math.round(tot.fat);
document.getElementById('itemsList').innerHTML=li||'<li>ما قدرت أتعرف على عناصر واضحة، جرب أسماء أبسط مثل: تفاحة، خبز، جبنة، عصير</li>';
let hasGrain=groups.has('grain'),hasPro=groups.has('protein')||groups.has('dairy'),hasFruit=groups.has('fruit')||groups.has('veg');
let ok=hasGrain&&hasPro&&hasFruit;
let v=document.getElementById('verdict');
if(matches.length===0){v.className='verdict';v.textContent='';}
else if(ok){v.className='verdict ok';v.textContent='✅ وجبة متكاملة تقريبًا: فيها نشويات وبروتين وفاكهة/خضار';}
else{v.className='verdict no';v.textContent='⚠️ الوجبة ناقصة بعض العناصر';}
let sugg=[];
if(matches.length>0){
if(!hasGrain)sugg.push('أضف مصدر نشويات مثل خبز أو أرز أو تميس');
if(!hasPro)sugg.push('أضف مصدر بروتين مثل بيضة أو جبنة أو دجاج أو زبادي');
if(!hasFruit)sugg.push('أضف فاكهة أو خضار لزيادة الفيتامينات والألياف');
if(tot.cal<200)sugg.push('السعرات قليلة نسبيًا لوجبة، فكر تضيف عنصر ثاني');
if(tot.cal>700)sugg.push('السعرات مرتفعة نسبيًا لوجبة خفيفة، حاول تقلل الكمية');
}
document.getElementById('sugg').innerHTML=sugg.map(s=>`<li>${s}</li>`).join('');
}
</script>
</body>
</html>
